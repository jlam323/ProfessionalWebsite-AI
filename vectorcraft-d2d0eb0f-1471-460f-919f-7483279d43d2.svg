<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <radialGradient id="bgGrad" cx="50%" cy="50%" r="75%">
      <stop offset="0%" stop-color="#B3001B"/>
      <stop offset="100%" stop-color="#4A0008"/>
    </radialGradient>

    <!-- Halftone Pattern -->
    <pattern id="halftone" x="0" y="0" width="12" height="12" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <circle cx="3" cy="3" r="3" fill="#000000" opacity="0.4"/>
    </pattern>

    <!-- Hard Drop Shadow for Splat -->
    <filter id="hard-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="12" dy="16" stdDeviation="0" flood-color="#000000" flood-opacity="0.85"/>
    </filter>

    <!-- Main Splat Path -->
    <path id="splat" d="M 260 60 L 330 130 L 450 80 L 380 200 L 480 290 L 360 330 L 400 450 L 280 390 L 180 460 L 190 350 L 60 320 L 160 240 L 70 120 L 190 170 Z" />

    <!-- Clip Path for Splat Texture -->
    <clipPath id="splat-clip">
      <use href="#splat" />
    </clipPath>

    <!-- Letter Paths -->
    <path id="letter-J" d="M 130 160 L 230 145 L 220 195 L 185 200 L 170 320 L 100 330 L 80 250 L 130 240 L 135 285 L 145 280 L 155 205 L 125 210 Z" />
    <path id="letter-L" d="M 250 140 L 300 130 L 280 300 L 400 280 L 390 330 L 230 360 Z" />

    <!-- Star Path -->
    <path id="star" d="M 0 -20 L 4 -4 L 20 0 L 4 4 L 0 20 L -4 4 L -20 0 L -4 -4 Z" />
  </defs>

  <!-- Background -->
  <rect width="512" height="512" fill="url(#bgGrad)"/>
  <rect width="512" height="512" fill="url(#halftone)"/>

  <!-- Dynamic Background Stripes -->
  <g fill="#E60012" opacity="0.85">
    <polygon points="-100,100 600,-150 600,-50 -100,200" />
    <polygon points="-100,300 600,50 600,100 -100,350" />
    <polygon points="-100,500 600,250 600,350 -100,600" />
  </g>

  <!-- Splat Layers -->
  <!-- 1. Red Offset -->
  <use href="#splat" x="-25" y="25" fill="#E60012" />
  
  <!-- 2. White Border with Shadow -->
  <use href="#splat" x="0" y="0" fill="#FFFFFF" stroke="#FFFFFF" stroke-width="18" stroke-linejoin="miter" stroke-miterlimit="10" filter="url(#hard-shadow)" />
  
  <!-- 3. Black Core -->
  <use href="#splat" x="0" y="0" fill="#000000" />

  <!-- Splat Inner Texture (Dark Grey Stripes) -->
  <g clip-path="url(#splat-clip)">
    <path d="M -100 100 L 600 -100 L 600 -80 L -100 120 Z" fill="#1A1A1A"/>
    <path d="M -100 200 L 600 0 L 600 20 L -100 220 Z" fill="#1A1A1A"/>
    <path d="M -100 300 L 600 100 L 600 120 L -100 320 Z" fill="#1A1A1A"/>
    <path d="M -100 400 L 600 200 L 600 220 L -100 420 Z" fill="#1A1A1A"/>
    <path d="M -100 500 L 600 300 L 600 320 L -100 520 Z" fill="#1A1A1A"/>
  </g>

  <!-- Text Layers -->
  <!-- Red 3D Extrusion/Shadow -->
  <use href="#letter-J" x="-12" y="12" fill="#E60012" />
  <use href="#letter-L" x="-12" y="12" fill="#E60012" />

  <!-- White Text Core -->
  <use href="#letter-J" x="0" y="0" fill="#FFFFFF" />
  <use href="#letter-L" x="0" y="0" fill="#FFFFFF" />

  <!-- Distressed Text Cutouts (Black triangles to simulate torn paper) -->
  <polygon points="280,200 300,210 295,190" fill="#000000" />
  <polygon points="180,250 195,260 175,270" fill="#000000" />
  <polygon points="350,300 360,320 340,315" fill="#000000" />
  <polygon points="120,170 135,165 125,185" fill="#000000" />
  <polygon points="380,280 395,290 385,275" fill="#000000" />

  <!-- Masking Tape Strips -->
  <polygon points="110,140 150,130 155,150 115,160" fill="#FFFFFF" opacity="0.6" />
  <polygon points="370,270 410,280 405,300 365,290" fill="#FFFFFF" opacity="0.6" />
  <polygon points="230,40 270,30 275,50 235,60" fill="#FFFFFF" opacity="0.6" />
  <polygon points="150,420 190,400 195,420 155,440" fill="#FFFFFF" opacity="0.6" />

  <!-- Floating Confetti / Shards -->
  <polygon points="100,80 120,60 130,90" fill="#E60012"/>
  <polygon points="400,120 430,100 420,140" fill="#FFFFFF"/>
  <polygon points="450,380 480,390 440,420" fill="#E60012"/>
  <polygon points="120,420 150,400 140,450" fill="#FFFFFF"/>
  <polygon points="250,40 270,20 280,50" fill="#FFFFFF"/>

  <!-- Floating Dots -->
  <circle cx="460" cy="70" r="6" fill="#FFFFFF"/>
  <circle cx="475" cy="85" r="4" fill="#E60012"/>
  <circle cx="50" cy="300" r="8" fill="#E60012"/>
  <circle cx="70" cy="340" r="5" fill="#FFFFFF"/>
  <circle cx="200" cy="480" r="7" fill="#FFFFFF"/>
  <circle cx="380" cy="470" r="5" fill="#E60012"/>
  <circle cx="280" cy="40" r="6" fill="#E60012"/>

  <!-- Iconic 4-Pointed Stars -->
  <use href="#star" transform="translate(100, 120) rotate(15) scale(1.5)" fill="#E60012" />
  <use href="#star" transform="translate(420, 220) rotate(-20) scale(2)" fill="#FFFFFF" />
  <use href="#star" transform="translate(220, 430) rotate(45) scale(1.2)" fill="#E60012" />
  <use href="#star" transform="translate(350, 90) rotate(10) scale(1)" fill="#FFFFFF" />
  
  <!-- Small Star Overlapping J for extra flair -->
  <use href="#star" transform="translate(110, 150) rotate(-15) scale(0.8)" fill="#000000" stroke="#FFFFFF" stroke-width="3"/>
</svg>