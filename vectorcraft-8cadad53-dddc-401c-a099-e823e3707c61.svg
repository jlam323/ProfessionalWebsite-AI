<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
    <defs>
        <radialGradient id="bg-grad" cx="50%" cy="50%" r="75%">
            <stop offset="0%" stop-color="#D90016"/>
            <stop offset="100%" stop-color="#7A000C"/>
        </radialGradient>
        <pattern id="halftone" width="12" height="12" patternTransform="rotate(45)" patternUnits="userSpaceOnUse">
            <circle cx="6" cy="6" r="3.5" fill="#000000" opacity="0.35"/>
        </pattern>
    </defs>

    <!-- Deep Red Gradient Background -->
    <rect width="512" height="512" fill="url(#bg-grad)"/>
    
    <!-- Dynamic Radial Burst Lines -->
    <path d="M 256 256 L 0 60 L 0 0 L 60 0 Z
             M 256 256 L 160 0 L 210 0 Z
             M 256 256 L 340 0 L 390 0 Z
             M 256 256 L 512 60 L 512 0 L 452 0 Z
             M 256 256 L 512 180 L 512 230 Z
             M 256 256 L 512 380 L 512 430 Z
             M 256 256 L 460 512 L 410 512 Z
             M 256 256 L 260 512 L 210 512 Z
             M 256 256 L 60 512 L 0 512 L 0 452 Z
             M 256 256 L 0 320 L 0 270 Z" 
          fill="#000000" opacity="0.2"/>

    <!-- Halftone Pattern Overlay -->
    <rect width="512" height="512" fill="url(#halftone)"/>

    <!-- Jagged Background Tape / Strips -->
    <polygon points="-10,90 522,-10 522,20 -10,120" fill="#FFFFFF" opacity="0.15"/>
    <polygon points="-10,470 522,350 522,390 -10,510" fill="#000000" opacity="0.4"/>

    <!-- Main Splatter Drop Shadow (Bright Red) -->
    <polygon points="256,20 350,50 480,30 420,150 500,240 410,320 470,480 340,420 256,490 170,430 40,480 100,340 20,240 110,160 40,40 160,80" 
             fill="#E50012" transform="translate(14, 14)"/>

    <!-- Main Splatter (Black with Thick White Stroke) -->
    <polygon points="256,20 350,50 480,30 420,150 500,240 410,320 470,480 340,420 256,490 170,430 40,480 100,340 20,240 110,160 40,40 160,80" 
             fill="#000000" stroke="#FFFFFF" stroke-width="16" stroke-linejoin="miter" stroke-miterlimit="20"/>

    <!-- Stylized Tape Over Splatter -->
    <polygon points="170,20 270,10 275,35 175,45" fill="#FFFFFF" opacity="0.8"/>
    <polygon points="310,470 410,455 405,485 305,500" fill="#FFFFFF" opacity="0.8"/>

    <!-- Floating Confetti / Shards -->
    <polygon points="50,110 75,95 85,120 60,135" fill="#FFFFFF"/>
    <polygon points="430,75 455,60 445,85" fill="#E50012"/>
    <polygon points="70,410 95,435 60,445" fill="#E50012"/>
    <polygon points="410,460 435,435 460,470 425,485" fill="#FFFFFF"/>
    
    <!-- Persona Style 4-Point Stars -->
    <path d="M 460 110 L 465 125 L 480 130 L 465 135 L 460 150 L 455 135 L 440 130 L 455 125 Z" fill="#FFFFFF"/>
    <path d="M 90 370 L 95 385 L 110 390 L 95 395 L 90 410 L 85 395 L 70 390 L 85 385 Z" fill="#E50012"/>

    <!-- Text Drop Shadows (Red) -->
    <g transform="translate(12, 12)" fill="#E50012">
        <!-- L Shadow -->
        <path d="M 300 140 L 340 135 L 325 300 L 430 280 L 440 320 L 290 350 Z"/>
        <!-- J Shadow -->
        <path d="M 190 160 L 310 140 L 315 190 L 260 195 L 240 300 L 210 360 L 130 340 L 110 260 L 150 250 L 165 305 L 190 315 L 210 260 L 230 200 L 180 205 Z"/>
    </g>

    <!-- Main Text "JL" (White) -->
    <g fill="#FFFFFF">
        <!-- L -->
        <path d="M 300 140 L 340 135 L 325 300 L 430 280 L 440 320 L 290 350 Z"/>
        <!-- J -->
        <path d="M 190 160 L 310 140 L 315 190 L 260 195 L 240 300 L 210 360 L 130 340 L 110 260 L 150 250 L 165 305 L 190 315 L 210 260 L 230 200 L 180 205 Z"/>
    </g>

    <!-- Grunge / Scratch Details on Text -->
    <polyline points="240,210 250,230 235,240" fill="none" stroke="#000000" stroke-width="5" stroke-linecap="square"/>
    <polyline points="315,180 305,200 320,210" fill="none" stroke="#000000" stroke-width="5" stroke-linecap="square"/>
    <polyline points="140,300 150,315 135,325" fill="none" stroke="#000000" stroke-width="5" stroke-linecap="square"/>
    <polyline points="370,295 385,305 375,315" fill="none" stroke="#000000" stroke-width="5" stroke-linecap="square"/>

</svg>