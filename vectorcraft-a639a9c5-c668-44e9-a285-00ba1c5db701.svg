<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="100%" height="100%">
    <defs>
        <pattern id="ht-bg" width="16" height="16" patternUnits="userSpaceOnUse" patternTransform="rotate(15)">
            <circle cx="4" cy="4" r="4" fill="#F5F5F5" opacity="0.9" />
        </pattern>
        <pattern id="ht-red" width="12" height="12" patternUnits="userSpaceOnUse" patternTransform="rotate(25)">
            <rect width="12" height="12" fill="#F5F5F5" />
            <circle cx="4" cy="4" r="4" fill="#E3001B" />
        </pattern>
        <pattern id="ht-black" width="12" height="12" patternUnits="userSpaceOnUse" patternTransform="rotate(-15)">
            <rect width="12" height="12" fill="#E3001B" />
            <circle cx="4" cy="4" r="4" fill="#111111" />
        </pattern>

        <path id="splatter" d="M 380 20 L 420 70 L 480 10 L 520 80 L 620 20 L 600 110 L 760 90 L 670 180 L 790 260 L 680 310 L 780 420 L 640 400 L 710 540 L 560 470 L 490 590 L 410 490 L 280 580 L 260 460 L 90 510 L 170 380 L 30 280 L 160 220 L 80 80 L 240 130 L 290 40 Z" />
        
        <path id="shape-j" d="M 50 30 L 190 0 L 170 250 L 90 310 L 0 240 L 10 140 L 70 160 L 60 210 L 90 230 L 110 210 L 120 70 L 60 80 Z" />
        
        <path id="shape-l" d="M 10 20 L 80 0 L 60 220 L 190 190 L 200 260 L 0 300 Z" />
        
        <path id="star" d="M 0 -20 L 5 -5 L 20 0 L 5 5 L 0 20 L -5 5 L -20 0 L -5 -5 Z" />
    </defs>

    <rect width="100%" height="100%" fill="#111111" />

    <use href="#splatter" transform="translate(-30, 30)" fill="url(#ht-bg)" />

    <use href="#splatter" fill="#E3001B" stroke="#F5F5F5" stroke-width="8" stroke-linejoin="miter" stroke-miterlimit="10" />

    <polygon points="-10,80 810,180 810,210 -10,110" fill="#111111" stroke="#F5F5F5" stroke-width="4" opacity="0.9"/>
    <polygon points="-10,500 810,400 810,420 -10,520" fill="#F5F5F5" opacity="0.9"/>

    <polygon points="120,100 390,70 420,480 150,500" fill="url(#ht-red)" stroke="#111111" stroke-width="12" stroke-linejoin="miter" />
    
    <polygon points="320,120 620,80 590,450 290,480" fill="url(#ht-black)" stroke="#F5F5F5" stroke-width="12" stroke-linejoin="miter" />

    <g transform="translate(180, 130) rotate(-6)">
        <use href="#shape-j" x="18" y="18" fill="#E3001B" />
        <use href="#shape-j" x="0" y="0" fill="#111111" stroke="#111111" stroke-width="28" stroke-linejoin="miter" stroke-miterlimit="10" />
        <use href="#shape-j" x="0" y="0" fill="#F5F5F5" />
    </g>

    <g transform="translate(350, 130) rotate(4)">
        <use href="#shape-l" x="18" y="18" fill="#E3001B" />
        <use href="#shape-l" x="0" y="0" fill="#F5F5F5" stroke="#F5F5F5" stroke-width="28" stroke-linejoin="miter" stroke-miterlimit="10" />
        <use href="#shape-l" x="0" y="0" fill="#111111" />
    </g>

    <path d="M 650 400 L 680 370 L 700 410 L 740 390 L 720 430 L 770 450 L 720 470 L 740 510 L 700 490 L 680 530 L 660 490 L 610 500 L 640 460 L 600 430 Z" fill="#111111" stroke="#F5F5F5" stroke-width="6" stroke-linejoin="miter" />
    <polygon points="680,420 700,420 695,460 685,460" fill="#E3001B" />
    <polygon points="685,470 695,470 695,480 685,480" fill="#E3001B" />

    <use href="#star" fill="#F5F5F5" transform="translate(120, 120) scale(1.5)" />
    <use href="#star" fill="#111111" transform="translate(650, 150) scale(2.5) rotate(15)" />
    <use href="#star" fill="#E3001B" transform="translate(250, 520) scale(1.8) rotate(-20)" />
    <use href="#star" fill="#F5F5F5" transform="translate(720, 350) scale(1)" />
    <use href="#star" fill="#F5F5F5" transform="translate(80, 350) scale(1.2) rotate(45)" />

    <polygon points="100,50 120,40 110,80" fill="#E3001B" />
    <polygon points="700,50 750,70 720,100" fill="#F5F5F5" />
    <polygon points="50,500 80,480 60,550" fill="#F5F5F5" />
    <polygon points="400,550 450,530 420,580" fill="#E3001B" />
    <polygon points="200,55 230,45 250,70 210,80" fill="#111111" stroke="#F5F5F5" stroke-width="3" />
</svg>