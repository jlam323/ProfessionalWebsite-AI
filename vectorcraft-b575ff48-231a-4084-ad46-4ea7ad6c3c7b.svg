<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
    <defs>
        <!-- Background Vignette -->
        <radialGradient id="bgGrad" cx="50%" cy="50%" r="75%">
            <stop offset="0%" stop-color="#2a2a2a" />
            <stop offset="100%" stop-color="#0a0a0a" />
        </radialGradient>

        <!-- Main Red Gradient for Starburst -->
        <linearGradient id="redGrad" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#FF0015" />
            <stop offset="100%" stop-color="#B3000E" />
        </linearGradient>

        <!-- Halftone Pattern (Red) -->
        <pattern id="halftone" width="12" height="12" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
            <circle cx="6" cy="6" r="2.5" fill="#E60012" />
        </pattern>

        <!-- Halftone Pattern (Dark) -->
        <pattern id="halftone-dark" width="16" height="16" patternUnits="userSpaceOnUse" patternTransform="rotate(15)">
            <circle cx="8" cy="8" r="3" fill="#000000" opacity="0.35" />
        </pattern>

        <!-- Base Jagged Starburst Path -->
        <polygon id="starburst" points="250,30 300,110 430,50 360,150 480,220 390,280 460,420 320,380 260,480 190,390 80,450 130,310 30,240 120,170 60,70 170,110" />

        <!-- 4-Point Sharp Star Path -->
        <path id="p5star" d="M 0,-20 L 4,-4 L 20,0 L 4,4 L 0,20 L -4,4 L -20,0 L -4,-4 Z" />
    </defs>

    <!-- Base Background -->
    <rect width="512" height="512" fill="url(#bgGrad)" />
    <rect width="512" height="512" fill="url(#halftone)" opacity="0.25" />

    <!-- Dynamic Diagonal Speed Lines -->
    <path d="M -100,150 L 600,-50 L 600,10 L -100,210 Z" fill="#E60012" opacity="0.3" />
    <path d="M -100,350 L 600,150 L 600,230 L -100,430 Z" fill="#E60012" opacity="0.15" />
    <path d="M 100,600 L 700,430 L 700,460 L 100,630 Z" fill="#E60012" opacity="0.4" />
    <path d="M -50,500 L 400,-100 L 450,-100 L 0,500 Z" fill="#000000" opacity="0.5" />

    <!-- Background Floating Triangles -->
    <polygon points="50,50 80,40 60,90" fill="#E60012" opacity="0.6" />
    <polygon points="450,450 490,430 460,490" fill="#E60012" opacity="0.6" />
    <polygon points="100,300 120,290 110,330" fill="#FFFFFF" opacity="0.15" />
    <polygon points="400,150 430,140 410,180" fill="#000000" opacity="0.5" />

    <!-- Main Logo Composition (Tilted for dynamic effect) -->
    <g transform="rotate(-6 256 256)">
        
        <!-- Starburst Layers (Shadow, Border, Core) -->
        <use href="#starburst" fill="#000000" transform="translate(14, 18)" />
        <use href="#starburst" fill="#FFFFFF" transform="translate(-4, -4)" stroke="#FFFFFF" stroke-width="16" stroke-linejoin="miter" />
        <use href="#starburst" fill="url(#redGrad)" />
        
        <!-- Inner Halftone Texture on Red Starburst -->
        <use href="#starburst" fill="url(#halftone-dark)" />

        <!-- Ransom Note Block J (Black) -->
        <polygon points="110,140 150,110 190,130 260,120 270,180 250,210 260,280 240,350 180,340 150,370 90,330 70,260 100,200" fill="#000000" />

        <!-- Ransom Note Block L (White) with Black Drop Shadow -->
        <polygon points="240,110 300,120 350,90 440,110 420,180 450,250 410,360 340,340 290,380 220,340 240,260 210,180" fill="#000000" transform="translate(12, 12)" />
        <polygon points="240,110 300,120 350,90 440,110 420,180 450,250 410,360 340,340 290,380 220,340 240,260 210,180" fill="#FFFFFF" />

        <!-- Jagged Tape/Accent Marks -->
        <polygon points="100,120 130,110 125,140 95,150" fill="#FFFFFF" />
        <polygon points="410,340 440,330 435,360 405,370" fill="#E60012" />
        <polygon points="230,350 260,345 255,370 225,375" fill="#000000" />
        <polygon points="260,100 290,95 285,120 255,125" fill="#E60012" />

        <!-- Stylized Text "J" (White with Red Shadow) -->
        <path d="M 140,150 L 230,140 L 225,185 L 190,190 L 180,270 L 140,300 L 90,270 L 105,220 L 140,245 L 145,195 L 135,195 Z" fill="#E60012" transform="translate(-8, 8)" />
        <path d="M 140,150 L 230,140 L 225,185 L 190,190 L 180,270 L 140,300 L 90,270 L 105,220 L 140,245 L 145,195 L 135,195 Z" fill="#FFFFFF" />

        <!-- Stylized Text "L" (Black with Red Shadow) -->
        <path d="M 270,140 L 320,130 L 300,270 L 410,250 L 400,300 L 250,320 Z" fill="#E60012" transform="translate(-8, 8)" />
        <path d="M 270,140 L 320,130 L 300,270 L 410,250 L 400,300 L 250,320 Z" fill="#000000" />

    </g>

    <!-- Floating Sharp Stars (Foreground) -->
    <use href="#p5star" fill="#FFFFFF" transform="translate(80, 100) rotate(15)" />
    <use href="#p5star" fill="#E60012" transform="translate(430, 90) rotate(-25)" />
    <use href="#p5star" fill="#000000" transform="translate(450, 420) rotate(40)" />
    <use href="#p5star" fill="#FFFFFF" transform="translate(100, 430) rotate(-10)" />
    <use href="#p5star" fill="#E60012" transform="translate(256, 60) rotate(5)" />
    <use href="#p5star" fill="#000000" transform="translate(50, 256) rotate(45)" />
    <use href="#p5star" fill="#FFFFFF" transform="translate(380, 460) rotate(-15)" />
</svg>